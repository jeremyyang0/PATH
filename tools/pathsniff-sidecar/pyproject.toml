[project]
name = "pathsniff-sidecar"
version = "0.1.0"
description = "Standalone PATH Sniff sidecar"
authors = [
    { name = "PATH" },
]
dependencies = [
    "PySide2",
]
requires-python = ">=3.8"

[project.optional-dependencies]
build = [
    "nuitka>=2.7.0",
]

[project.scripts]
path-sniff = "pathsniff.sniff.cli:gui_entry"
path-sniff-cli = "pathsniff.sniff.cli:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "/pathsniff",
]
