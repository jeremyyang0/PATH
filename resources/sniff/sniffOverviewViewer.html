<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniff Overview</title>
    <style>
        :root {
            --bg: var(--vscode-panel-background);
            --surface: color-mix(in srgb, var(--vscode-editor-background) 96%, transparent);
            --surface-strong: color-mix(in srgb, var(--vscode-editorWidget-background) 90%, transparent);
            --border: color-mix(in srgb, var(--vscode-panel-border) 78%, transparent);
            --muted: var(--vscode-descriptionForeground);
            --accent: var(--vscode-button-background);
            --accent-fg: var(--vscode-button-foreground);
            --tab-active: var(--vscode-tab-activeBackground);
            --tab-inactive: var(--vscode-tab-inactiveBackground);
            --radius: 8px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 8px;
            height: 100vh;
            font: 12px/1.42 "Segoe UI", "Microsoft YaHei", sans-serif;
            color: var(--vscode-foreground);
            background: var(--bg);
            overflow: hidden;
        }

        .app {
            height: 100%;
            min-height: 0;
            display: grid;
            grid-template-rows: auto 1fr;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            align-items: stretch;
            min-width: 0;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            background: var(--surface-strong);
        }

        .tab {
            min-width: 88px;
            border: 0;
            border-right: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
            padding: 8px 14px;
            cursor: pointer;
            background: var(--tab-inactive);
            color: var(--vscode-foreground);
            font: inherit;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--tab-active);
            color: var(--vscode-tab-activeForeground);
            box-shadow: inset 0 -2px 0 var(--accent);
            font-weight: 700;
        }

        .tab-panel {
            min-height: 0;
            display: none;
            overflow: hidden;
        }

        .tab-panel.active {
            display: grid;
            grid-template-rows: 1fr auto;
        }

        .table-wrap {
            min-height: 0;
            overflow: auto;
        }

        .widget-def-block {
            border-top: 1px solid var(--border);
            background: color-mix(in srgb, var(--surface-strong) 72%, transparent);
            padding: 8px;
            display: grid;
            grid-template-rows: auto minmax(96px, 150px) auto;
            gap: 6px;
        }

        .widget-def-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            font-weight: 700;
        }

        .meta {
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
            white-space: nowrap;
        }

        .button {
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            background: var(--accent);
            color: var(--accent-fg);
            font: inherit;
            font-weight: 700;
        }

        .empty,
        .json-box {
            margin: 0;
            padding: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty { color: var(--muted); }

        .json-box {
            height: 100%;
            overflow: auto;
            border: 1px solid var(--border);
            background: var(--vscode-editor-background);
            font: 11px/1.45 Consolas, "Courier New", monospace;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 6px 8px;
            border-right: 1px solid color-mix(in srgb, var(--border) 68%, transparent);
            border-bottom: 1px solid color-mix(in srgb, var(--border) 68%, transparent);
            vertical-align: top;
            word-break: break-word;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--surface-strong);
            font-weight: 700;
        }

        td:last-child,
        th:last-child {
            border-right: 0;
        }

        .key-cell {
            width: 34%;
            color: var(--muted);
        }

        @media (max-width: 560px) {
            body { padding: 6px; }
            .tab { min-width: 76px; padding: 7px 10px; }
            .widget-def-block { grid-template-rows: auto minmax(80px, 120px) auto; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="tabs" role="tablist" aria-label="Sniff overview tabs">
            <button class="tab active" data-tab="widgetInfo" type="button" role="tab">WidgetInfo</button>
            <button class="tab" data-tab="properties" type="button" role="tab">支持属性</button>
            <button class="tab" data-tab="signals" type="button" role="tab">信号</button>
            <button class="tab" data-tab="slots" type="button" role="tab">槽函数</button>
        </div>

        <section id="widgetInfoPanel" class="tab-panel active" data-panel="widgetInfo" role="tabpanel">
            <div id="widgetInfoContainer" class="table-wrap"></div>
            <div class="widget-def-block">
                <div class="widget-def-header">
                    <span>Widget Definition:</span>
                    <span id="widgetDefMeta" class="meta"></span>
                </div>
                <pre id="widgetDefContainer" class="json-box"></pre>
                <button id="copyWidgetDefButton" class="button" type="button">复制</button>
            </div>
        </section>

        <section id="propertiesPanel" class="tab-panel" data-panel="properties" role="tabpanel">
            <div id="propertiesContainer" class="table-wrap"></div>
        </section>

        <section id="signalsPanel" class="tab-panel" data-panel="signals" role="tabpanel">
            <div id="signalsContainer" class="table-wrap"></div>
        </section>

        <section id="slotsPanel" class="tab-panel" data-panel="slots" role="tabpanel">
            <div id="slotsContainer" class="table-wrap"></div>
        </section>
    </div>

    <script src="sniffOverviewViewer.js"></script>
</body>
</html>
