<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniff Tree</title>
    <style>
        :root {
            --bg-panel: color-mix(in srgb, var(--vscode-sideBar-background) 88%, transparent);
            --bg-surface: var(--vscode-editor-background);
            --bg-elevated: color-mix(in srgb, var(--vscode-editorWidget-background) 92%, transparent);
            --border: color-mix(in srgb, var(--vscode-panel-border) 70%, transparent);
            --accent: var(--vscode-button-background);
            --accent-strong: var(--vscode-textLink-foreground);
            --muted: var(--vscode-descriptionForeground);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            height: 100vh;
            font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
            color: var(--vscode-foreground);
            background:
                radial-gradient(circle at top right, color-mix(in srgb, var(--accent) 14%, transparent), transparent 34%),
                linear-gradient(180deg, color-mix(in srgb, var(--vscode-editor-background) 96%, black 4%), var(--vscode-editor-background));
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
            height: 100%;
        }

        .toolbar,
        .panel {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-elevated);
            box-shadow: var(--shadow);
        }

        .toolbar {
            padding: 8px 10px;
        }

        .toolbar-row {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            overflow: visible;
            flex-wrap: wrap;
        }

        .toolbar-label {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .compact-input {
            flex: 1 1 auto;
            min-width: 0;
            padding: 5px 8px;
            border-radius: 7px;
        }

        .mode-select {
            width: 92px;
            flex: 0 0 92px;
        }

        .host-input {
            min-width: 92px;
            flex: 1 1 96px;
        }

        .path-input {
            min-width: 160px;
            flex: 2 1 180px;
        }

        .args-input {
            min-width: 120px;
            flex: 1 1 140px;
        }

        .path-input[readonly] {
            color: var(--vscode-input-foreground);
            cursor: default;
        }

        .profile-select {
            min-width: 160px;
            flex: 1 1 200px;
        }

        .modal.modal-compact {
            grid-template-rows: auto 1fr auto;
        }

        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 16px;
        }

        .profile-list-empty {
            color: var(--muted);
            padding: 16px 0;
            text-align: center;
        }

        .profile-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: color-mix(in srgb, var(--bg-surface) 70%, transparent);
        }

        .profile-row-meta {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .profile-row-name {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .profile-row-detail {
            color: var(--muted);
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .manager-toolbar {
            display: flex;
            justify-content: flex-end;
            padding: 12px 16px 0;
        }

        .edit-form {
            display: grid;
            gap: 10px;
            padding: 12px 16px;
        }

        .form-row {
            display: grid;
            gap: 4px;
        }

        .form-row-label {
            color: var(--muted);
            font-size: 11px;
        }

        .input-with-button {
            display: flex;
            gap: 6px;
            align-items: stretch;
        }

        .input-with-button .input {
            flex: 1 1 auto;
            min-width: 0;
        }

        .ellipsis-button {
            padding: 5px 12px;
            border-radius: 7px;
            flex: 0 0 auto;
        }

        .edit-form[hidden],
        .modal-footer[hidden] {
            display: none;
        }

        .connection-field {
            display: none;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .connection-field.visible {
            display: flex;
        }

        .compact-number-input {
            width: 92px;
            min-width: 92px;
            padding: 5px 6px;
            border-radius: 7px;
        }

        .port-input,
        .pid-input {
            width: 104px;
            min-width: 104px;
            flex: 0 0 104px;
        }

        .compact-button {
            padding: 5px 10px;
            border-radius: 7px;
            flex: 0 0 auto;
        }

        .inline-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            min-width: fit-content;
            flex: 0 0 auto;
        }

        .toggle {
            width: 14px;
            height: 14px;
            accent-color: var(--accent);
        }

        .toolbar-unit {
            color: var(--muted);
            font-size: 11px;
        }

        .connection-label {
            color: var(--muted);
            font-size: 11px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1 1 120px;
        }

        .field-label,
        .status-text,
        .meta {
            color: var(--muted);
            font-size: 12px;
        }

        .field-label {
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 10px;
            background: var(--bg-surface);
            color: inherit;
            outline: none;
        }

        .input:focus {
            border-color: var(--accent);
        }

        .button {
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            background: var(--accent);
            color: var(--vscode-button-foreground);
            font-weight: 600;
        }

        .button.secondary {
            background: color-mix(in srgb, var(--vscode-button-secondaryBackground) 92%, transparent);
            color: var(--vscode-button-secondaryForeground);
        }

        .icon-button {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid color-mix(in srgb, var(--border) 88%, transparent);
            border-radius: 10px;
            cursor: pointer;
            background: color-mix(in srgb, var(--bg-surface) 92%, transparent);
            color: inherit;
            transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
        }

        .icon-button:hover {
            background: color-mix(in srgb, var(--accent) 16%, transparent);
            border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
            transform: translateY(-1px);
        }

        .icon-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .icon-button svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
        }

        .panel {
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            min-width: 0;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .panel-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .panel-content {
            min-height: 0;
            overflow: auto;
        }

        .tree-item {
            display: grid;
            grid-template-columns: auto auto 1fr;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 10px;
            margin: 2px 6px;
            cursor: pointer;
        }

        .tree-item:hover {
            background: color-mix(in srgb, var(--accent) 12%, transparent);
        }

        .tree-item.selected {
            background: color-mix(in srgb, var(--accent) 20%, transparent);
            color: var(--accent-strong);
        }

        .indent {
            width: 14px;
            flex-shrink: 0;
        }

        .twisty {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            opacity: 0.72;
            user-select: none;
            flex-shrink: 0;
            transition: transform 120ms ease, opacity 120ms ease, color 120ms ease;
        }

        .twisty:hover {
            opacity: 1;
        }

        .tree-item.selected .twisty {
            color: var(--accent-strong);
            opacity: 1;
        }

        .icon-chevron {
            width: 12px;
            height: 12px;
            fill: currentColor;
            transition: transform 120ms ease;
        }

        .twisty.expanded .icon-chevron {
            transform: rotate(90deg);
        }

        .icon-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.88;
        }

        .tree-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty {
            padding: 20px 12px;
            color: var(--muted);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.42);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-backdrop.visible {
            display: flex;
        }

        .modal {
            width: min(680px, calc(100vw - 32px));
            max-height: min(520px, calc(100vh - 32px));
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--bg-elevated);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: grid;
            grid-template-rows: auto auto 1fr auto;
        }

        .modal-title {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
        }

        .search-panel {
            display: grid;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
        }

        .search-input {
            min-height: 108px;
            resize: vertical;
            font: 12px/1.5 Consolas, "Courier New", monospace;
        }

        .modal-body {
            overflow: auto;
        }

        .result-row {
            padding: 10px 16px;
            border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
            cursor: pointer;
        }

        .result-row:hover {
            background: color-mix(in srgb, var(--accent) 12%, transparent);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        .context-menu {
            position: fixed;
            display: none;
            z-index: 1200;
            min-width: 160px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-elevated);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .context-menu.visible {
            display: block;
        }

        .context-item {
            padding: 10px 12px;
            cursor: pointer;
        }

        .context-item:hover {
            background: color-mix(in srgb, var(--accent) 14%, transparent);
        }

        .json-box {
            margin: 0;
            padding: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            font: 12px/1.5 Consolas, "Courier New", monospace;
        }

        @media (max-width: 560px) {
            body {
                padding: 8px;
            }

            .toolbar {
                padding: 8px;
            }

            .toolbar-row { gap: 4px; }

            .toolbar-label {
                font-size: 10px;
            }

            .compact-button {
                padding: 5px 8px;
            }

            .compact-number-input {
                width: 82px;
                min-width: 82px;
            }

            .port-input,
            .pid-input {
                width: 96px;
                min-width: 96px;
                flex-basis: 96px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="toolbar">
            <div class="toolbar-row">
                <span class="toolbar-label">mode</span>
                <select id="connectionModeSelect" class="input compact-input mode-select">
                    <option value="remote">Remote</option>
                    <option value="attach">Attach</option>
                    <option value="loadapp">LoadApp</option>
                </select>
                <span id="remoteFields" class="connection-field visible">
                    <input id="hostInput" class="input compact-input host-input" value="127.0.0.1" placeholder="host" />
                    <input id="portInput" class="input compact-number-input port-input" type="number" min="1" max="65535" placeholder="port" />
                </span>
                <span id="attachFields" class="connection-field">
                    <input id="pidInput" class="input compact-number-input pid-input" type="number" min="1" placeholder="pid" />
                </span>
                <span id="loadappFields" class="connection-field">
                    <select id="loadAppProfileSelect" class="input compact-input profile-select"></select>
                    <button id="manageLoadAppProfilesButton" class="button secondary compact-button" type="button">管理配置</button>
                </span>
                <button id="connectButton" class="button secondary compact-button">连接</button>
                <label class="inline-toggle">
                    <input id="autoRefreshToggle" class="toggle" type="checkbox" />
                    <span class="toolbar-label">自动刷新</span>
                </label>
                <input id="autoRefreshIntervalInput" class="input compact-number-input" type="number" min="1" step="1" value="5" />
                <span id="connectionLabel" class="connection-label">未连接</span>
                <span id="statusIndicator" class="connection-label">等待连接</span>
            </div>
        </div>

        <section class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>控件树</span>
                    <span id="treeMeta" class="field-label">0 nodes</span>
                    <span id="selectionMeta" class="field-label">未选择控件</span>
                </div>
                <div class="panel-actions">
                    <button id="pickButton" class="icon-button" type="button" title="拾取控件" aria-label="拾取控件">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="8"></circle>
                            <path d="M12 4v4"></path>
                            <path d="M12 16v4"></path>
                            <path d="M4 12h4"></path>
                            <path d="M16 12h4"></path>
                        </svg>
                    </button>
                    <button id="findButton" class="icon-button" type="button" title="查找" aria-label="查找">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="M20 20L16.65 16.65"></path>
                        </svg>
                    </button>
                    <button id="refreshButton" class="icon-button" type="button" title="刷新" aria-label="刷新">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                            <path d="M21 3v6h-6"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="treeContainer" class="panel-content"></div>
        </section>
    </div>

    <div id="searchModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-title">查找控件</div>
            <div class="search-panel">
                <span class="field-label">widget_def JSON</span>
                <textarea id="searchWidgetDefInput" class="input search-input" placeholder='{"type":"QPushButton","text":"OK"}'></textarea>
            </div>
            <div id="searchResultsBody" class="modal-body"></div>
            <div class="modal-footer">
                <button id="closeSearchModalButton" class="button secondary">关闭</button>
                <button id="submitSearchButton" class="button">搜索</button>
            </div>
        </div>
    </div>

    <div id="errorModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-title">错误详情</div>
            <div id="errorBody" class="modal-body"></div>
            <div class="modal-footer">
                <button id="copyErrorButton" class="button secondary">复制错误</button>
                <button id="closeErrorModalButton" class="button">关闭</button>
            </div>
        </div>
    </div>

    <div id="contextMenu" class="context-menu">
        <div data-action="view" class="context-item">查看属性</div>
        <div data-action="highlight" class="context-item">高亮闪烁</div>
        <div data-action="generate" class="context-item">生成 widget_def</div>
    </div>

    <div id="loadAppManagerModal" class="modal-backdrop">
        <div class="modal modal-compact">
            <div class="modal-title" id="loadAppManagerTitle">LoadApp 配置管理</div>
            <div class="modal-body">
                <div id="loadAppManagerListView">
                    <div class="manager-toolbar">
                        <button id="loadAppManagerNewButton" class="button" type="button">新建</button>
                    </div>
                    <div id="loadAppManagerProfileList" class="profile-list"></div>
                </div>
                <div id="loadAppManagerEditView" class="edit-form" hidden>
                    <div class="form-row">
                        <span class="form-row-label">配置名称</span>
                        <input id="loadAppEditNameInput" class="input" placeholder="例如：MyApp" />
                    </div>
                    <div class="form-row">
                        <span class="form-row-label">target.exe</span>
                        <div class="input-with-button">
                            <input id="loadAppEditTargetExeInput" class="input" placeholder="选择或输入 target.exe 路径" />
                            <button id="loadAppEditPickExeButton" class="button secondary ellipsis-button" type="button" title="浏览">...</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <span class="form-row-label">启动参数</span>
                        <input id="loadAppEditArgsInput" class="input" placeholder="可选" />
                    </div>
                </div>
            </div>
            <div class="modal-footer" id="loadAppManagerListFooter">
                <button id="loadAppManagerCloseButton" class="button" type="button">关闭</button>
            </div>
            <div class="modal-footer" id="loadAppManagerEditFooter" hidden>
                <button id="loadAppManagerCancelEditButton" class="button secondary" type="button">取消</button>
                <button id="loadAppManagerSaveEditButton" class="button" type="button">保存</button>
            </div>
        </div>
    </div>

    <script src="sniffViewer.js"></script>
</body>
</html>
